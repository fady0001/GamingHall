name: gaming_hall
description: "Gaming Hall - نظام إدارة صالات الألعاب (تطبيق سطح مكتب لنظام Windows)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # إدارة الحالة (نفس نمط المشروع الأصلي: Clean Architecture + Cubit)
  flutter_bloc: ^9.1.1

  # قاعدة البيانات: SQLite محلية (لا حاجة لتوليد كود)
  sqflite_common_ffi: ^2.4.0+2
  path_provider: ^2.1.6
  path: ^1.9.1

  # الأمان والترخيص
  crypto: ^3.0.7
  cryptography: ^2.9.0

  # الطباعة والفواتير
  printing: ^5.14.3
  pdf: ^3.12.0

  # سطح المكتب
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  local_notifier: ^0.1.6
  audioplayers: ^6.7.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/app_icon.png
    - assets/icons/tray_icon.ico
    - assets/sounds/chime.wav

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
